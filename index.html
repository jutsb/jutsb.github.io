<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Upload System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .radio-option label {
            font-size: 16px;
            color: #333;
            cursor: pointer;
            margin: 0;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .file-info {
            margin-top: 15px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 5px;
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .response-message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .response-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .response-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Invoice Upload System</h1>
            <p>Upload your invoice and manage your records</p>
        </div>

        <form id="uploadForm">
            <!-- Action Mode Selection -->
            <div class="form-group">
                <label>Action Mode</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="createMode" name="actionMode" value="create" checked>
                        <label for="createMode">Create Spreadsheet</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="enterMode" name="actionMode" value="enter">
                        <label for="enterMode">Enter Invoice</label>
                    </div>
                </div>
            </div>

            <!-- Company Name Input (for create mode) -->
            <div class="form-group" id="companyNameGroup">
                <label for="companyName">Company Name</label>
                <input type="text" id="companyName" placeholder="Enter company name">
            </div>

            <!-- Existing File Selection (for enter mode) -->
            <div class="form-group hidden" id="existingFileGroup">
                <label for="existingFileSelect">Select Company File</label>
                <select id="existingFileSelect">
                    <option value="">-- Select a company --</option>
                </select>
            </div>

            <!-- Sheet Type Selection (for enter mode) -->
            <div class="form-group hidden" id="sheetTypeGroup">
                <label for="sheetTypeSelect">Select Sheet</label>
                <select id="sheetTypeSelect">
                    <option value="">-- Select sheet type --</option>
                    <option value="sales">SALES</option>
                    <option value="purchases">PURCHASES</option>
                </select>
            </div>

            <!-- File Upload Area (only for enter mode) -->
            <div class="upload-area hidden" id="uploadArea">
                <div class="upload-icon">📁</div>
                <h3>Drop your invoice here or click to browse</h3>
                <p style="color: #666; margin-top: 10px;">Supported formats: JPG, JPEG, PNG, PDF</p>
                <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.pdf" style="display: none;">
            </div>

            <div class="file-info" id="fileInfo">
                <strong>Selected File:</strong> <span id="fileName"></span><br>
                <strong>File Type:</strong> <span id="fileType"></span><br>
                <strong>File Size:</strong> <span id="fileSize"></span>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Create Spreadsheet</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Processing...</p>
            </div>

            <div class="response-message" id="responseMessage"></div>
        </form>
    </div>

    <script>
        // Webhook URL - Replace with your n8n webhook URL
        const WEBHOOK_URL = 'https://nexorabizz.app.n8n.cloud/webhook/ocr';

        // LocalStorage key for storing company files
        const STORAGE_KEY = 'invoiceCompanyFiles';

        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileType = document.getElementById('fileType');
        const fileSize = document.getElementById('fileSize');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const responseMessage = document.getElementById('responseMessage');
        const companyNameGroup = document.getElementById('companyNameGroup');
        const existingFileGroup = document.getElementById('existingFileGroup');
        const sheetTypeGroup = document.getElementById('sheetTypeGroup');
        const companyNameInput = document.getElementById('companyName');
        const existingFileSelect = document.getElementById('existingFileSelect');
        const sheetTypeSelect = document.getElementById('sheetTypeSelect');

        let selectedFile = null;

        // Initialize company files from localStorage
        function loadCompanyFiles() {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        // Save company files to localStorage
        function saveCompanyFiles(files) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
        }

        // Populate existing files dropdown
        function populateExistingFiles() {
            const companies = loadCompanyFiles();
            existingFileSelect.innerHTML = '<option value="">-- Select a company --</option>';
            
            companies.forEach(company => {
                const option = document.createElement('option');
                option.value = JSON.stringify(company);
                option.textContent = company.companyName;
                existingFileSelect.appendChild(option);
            });
        }

        // Handle action mode radio change
        document.querySelectorAll('input[name="actionMode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'create') {
                    // CREATE MODE
                    companyNameGroup.classList.remove('hidden');
                    existingFileGroup.classList.add('hidden');
                    sheetTypeGroup.classList.add('hidden');
                    uploadArea.classList.add('hidden');
                    submitBtn.textContent = 'Create Spreadsheet';
                } else {
                    // ENTER MODE
                    companyNameGroup.classList.add('hidden');
                    existingFileGroup.classList.remove('hidden');
                    sheetTypeGroup.classList.remove('hidden');
                    uploadArea.classList.remove('hidden');
                    submitBtn.textContent = 'Upload Invoice';
                }
                responseMessage.style.display = 'none';
                fileInfo.style.display = 'none';
            });
        });

        // Upload area click handler
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop handlers
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#764ba2';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#667eea';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change handler
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Handle file selection
        function handleFile(file) {
            const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'application/pdf'];
            
            if (!validTypes.includes(file.type)) {
                alert('Please upload a valid file (JPG, JPEG, PNG, or PDF)');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileType.textContent = formatFileType(file.type);
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.style.display = 'block';
        }

        // Format file type for display
        function formatFileType(type) {
            const typeMap = {
                'image/jpeg': 'JPEG Image',
                'image/jpg': 'JPG Image',
                'image/png': 'PNG Image',
                'application/pdf': 'PDF Document'
            };
            return typeMap[type] || type;
        }

        // Format file size
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
            else return (bytes / 1048576).toFixed(2) + ' MB';
        }

        // Get correct MIME type
        function getCorrectMimeType(file) {
            if (file.type === 'image/jpg') return 'image/jpeg';
            if (file.type === 'image/jpeg') return 'image/jpeg';
            if (file.type === 'image/png') return 'image/png';
            if (file.type === 'application/pdf') return 'application/pdf';
            return file.type;
        }

        // Form submission
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const actionMode = document.querySelector('input[name="actionMode"]:checked').value;

            console.log('Form submitted, mode:', actionMode); // DEBUG

            if (actionMode === 'create') {
                await handleCreateMode();
            } else {
                await handleEnterMode();
            }
        });

        // Handle CREATE MODE
        async function handleCreateMode() {
            const companyName = companyNameInput.value.trim();

            console.log('CREATE mode, company name:', companyName); // DEBUG

            if (!companyName) {
                showMessage('Please enter a company name', 'error');
                return;
            }

            // Check if company already exists
            const companies = loadCompanyFiles();
            if (companies.some(c => c.companyName.toLowerCase() === companyName.toLowerCase())) {
                showMessage('Company already exists! Use "Enter Invoice" mode to upload invoices.', 'error');
                return;
            }

            // Show loading
            submitBtn.disabled = true;
            loading.querySelector('p').textContent = 'Creating spreadsheet...';
            loading.style.display = 'block';
            responseMessage.style.display = 'none';

            try {
                console.log('Sending to webhook:', WEBHOOK_URL); // DEBUG

                const formData = new FormData();
                formData.append('action', 'create');
                formData.append('companyName', companyName);

                // Send to webhook
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                console.log('Response status:', response.status); // DEBUG

                const result = await response.json();
                console.log('Response data:', result); // DEBUG

                if (response.ok && result.spreadsheetId) {
                    // Save to localStorage
                    const newCompany = {
                        companyName: companyName,
                        spreadsheetId: result.spreadsheetId,
                        salesSheetId: result.salesSheetId,
                        purchasesSheetId: result.purchasesSheetId,
                        createdAt: new Date().toISOString()
                    };

                    companies.push(newCompany);
                    saveCompanyFiles(companies);
                    populateExistingFiles();

                    showMessage(
                        `✅ Spreadsheet created for "${companyName}"!\nSpreadsheet ID: ${result.spreadsheetId}\nSales Sheet ID: ${result.salesSheetId}\nPurchases Sheet ID: ${result.purchasesSheetId}`,
                        'success'
                    );

                    // Reset form
                    companyNameInput.value = '';
                } else {
                    showMessage(result.message || 'Failed to create spreadsheet. Please try again.', 'error');
                }

            } catch (error) {
                console.error('Create error:', error);
                showMessage('An error occurred: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // Handle ENTER MODE
        async function handleEnterMode() {
            console.log('ENTER mode started'); // DEBUG

            if (!selectedFile) {
                showMessage('Please select a file to upload', 'error');
                return;
            }

            if (!existingFileSelect.value) {
                showMessage('Please select a company file', 'error');
                return;
            }

            if (!sheetTypeSelect.value) {
                showMessage('Please select a sheet type', 'error');
                return;
            }

            const selectedCompany = JSON.parse(existingFileSelect.value);
            const sheetType = sheetTypeSelect.value;

            // Show loading
            submitBtn.disabled = true;
            loading.querySelector('p').textContent = 'Processing your invoice...';
            loading.style.display = 'block';
            responseMessage.style.display = 'none';

            try {
                console.log('Sending to webhook:', WEBHOOK_URL); // DEBUG

                const formData = new FormData();
                
                // Convert file to base64 for n8n compatibility
                const base64File = await fileToBase64(selectedFile);
                const correctMimeType = getCorrectMimeType(selectedFile);

                formData.append('action', 'enter');
                formData.append('companyName', selectedCompany.companyName);
                formData.append('spreadsheetId', selectedCompany.spreadsheetId);
                
                // Get the correct sheet ID based on selected sheet type
                if (sheetType === 'sales') {
                    formData.append('sheetId', selectedCompany.salesSheetId);
                    formData.append('sheetName', 'SALES');
                } else {
                    formData.append('sheetId', selectedCompany.purchasesSheetId);
                    formData.append('sheetName', 'PURCHASES');
                }

                formData.append('invoiceType', sheetType);
                formData.append('file', selectedFile);
                formData.append('fileName', selectedFile.name);
                formData.append('mimeType', correctMimeType);
                formData.append('fileData', base64File);

                // Send to webhook
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                console.log('Response status:', response.status); // DEBUG

                const result = await response.json();
                console.log('Response data:', result); // DEBUG

                if (response.ok) {
                    showMessage(
                        `✅ Data successfully appended to ${sheetType.toUpperCase()} sheet for ${selectedCompany.companyName}!`,
                        'success'
                    );

                    // Reset form
                    selectedFile = null;
                    fileInfo.style.display = 'none';
                    fileInput.value = '';
                } else {
                    showMessage(result.message || 'Upload failed. Please try again.', 'error');
                }

            } catch (error) {
                console.error('Upload error:', error);
                showMessage('An error occurred: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // Convert file to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        // Show message to user
        function showMessage(message, type) {
            responseMessage.textContent = message;
            responseMessage.className = `response-message ${type}`;
            responseMessage.style.display = 'block';
            responseMessage.style.whiteSpace = 'pre-line';

            if (type === 'success') {
                setTimeout(() => {
                    responseMessage.style.display = 'none';
                }, 7000);
            }
        }

        // Initialize on page load
        populateExistingFiles();
    </script>
</body>
</html>
